name: Test github.io repo uses master branch (push fails gracefully)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a build directory with content
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site"
          echo "<html><body>My GitHub.io Site</body></html>" > "$GITHUB_WORKSPACE/site/index.html"

      - id: action
        uses: .
        continue-on-error: true
        env:
          BUILD_DIR: /github/workspace/site
          GH_PAT: fake-pat-not-used
          GITHUB_ACTOR: test-user
          # Simulate a user.github.io repo — action should target 'master' branch
          GITHUB_REPOSITORY: testuser/testuser.github.io

      - name: Assert action ran and failed gracefully (no real PAT for github.io repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real GH_PAT / sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
