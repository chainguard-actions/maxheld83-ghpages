name: Test missing BUILD_DIR fails immediately
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          BUILD_DIR: /github/workspace/nonexistent-dir-that-does-not-exist
          GH_PAT: fake-pat-not-used
          GITHUB_ACTOR: test-user

      - name: Assert action failed (nonexistent BUILD_DIR)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when BUILD_DIR does not exist"
          else
            echo "FAIL: expected failure but got '$OUTCOME'"
            exit 1
          fi
